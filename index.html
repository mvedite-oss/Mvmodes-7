<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MV Upload</title>
  <meta name="theme-color" content="#09090f">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="brand" href="#/"><span>MV</span> UPLOAD</a>
    <button id="adminButton" class="button small" type="button">ADM</button>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">ARMAZENAMENTO RÁPIDO</p>
      <h1>Envie. <span>Compartilhe.</span></h1>
      <p class="subtitle">Selecione um arquivo e receba um link permanente.</p>

      <div id="uploadArea" class="upload-area">
        <input id="fileInput" type="file">
        <label for="fileInput">
          <div class="upload-icon">⬆</div>
          <strong>Escolher arquivo</strong>
          <small>Arraste o arquivo aqui</small>
        </label>
      </div>

      <button id="uploadButton" class="button primary" type="button" disabled>Enviar arquivo</button>

      <div id="progressWrap" class="progress-wrap" hidden>
        <div class="progress"><div id="progressBar"></div></div>
        <span id="progressText">Preparando...</span>
      </div>

      <div id="result" class="result" hidden>
        <p>Arquivo enviado</p>
        <div class="link-row">
          <input id="linkOutput" readonly>
          <button id="copyButton" class="button primary" type="button">Copiar</button>
        </div>
        <a id="openButton" class="button" target="_blank" rel="noopener">Abrir arquivo</a>
      </div>
    </section>

    <section id="filesSection" class="files-section" hidden>
      <h2>Arquivos enviados</h2>
      <div id="filesList" class="files-list"></div>
    </section>
  </main>

  <footer>MV UPLOAD © <span id="year"></span></footer>
  <div id="toast"></div>

  <dialog id="adminDialog">
    <form method="dialog">
      <button class="close" value="cancel" type="submit">×</button>
      <p class="eyebrow">ÁREA ADMINISTRATIVA</p>
      <h2>Digite a senha</h2>
      <input id="adminPassword" type="password" placeholder="Senha">
      <button id="adminSubmit" class="button primary" type="button">Entrar</button>
      <p id="adminMessage"></p>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
